name: Build Android APK

on:
  push:
    tags:
      - 'build-*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Add Android platform
        run: npx cap add android
      
      - name: Sync Capacitor
        run: npx cap sync android
      
      - name: Patch permissions
        run: |
          chmod +x patch-permissions.sh
          bash patch-permissions.sh
      
      - name: Patch Gradle versions for Capacitor 7
        run: |
          cd android
          # Update AGP to 8.7.2 in project build.gradle
          sed -i 's/classpath "com.android.tools.build:gradle:[^"]*"/classpath "com.android.tools.build:gradle:8.7.2"/' build.gradle
          sed -i 's/classpath "com.android.tools.build:gradle:[^"]*"/classpath "com.android.tools.build:gradle:8.7.2"/' app/build.gradle 2>/dev/null || true
          # Update Kotlin to 1.9.25
          sed -i 's/ext.kotlin_version = "[^"]*"/ext.kotlin_version = "1.9.25"/' build.gradle 2>/dev/null || true
          # Update Gradle wrapper to 8.11.1
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-all.zip|' gradle/wrapper/gradle-wrapper.properties
          # Update SDK versions
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 23/' variables.gradle 2>/dev/null || true
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/' variables.gradle 2>/dev/null || true
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/' variables.gradle 2>/dev/null || true
          echo "=== Patched build.gradle ==="
          cat build.gradle
          echo "=== Patched gradle-wrapper.properties ==="
          cat gradle/wrapper/gradle-wrapper.properties
          echo "=== variables.gradle ==="
          cat variables.gradle 2>/dev/null || echo "No variables.gradle"
      
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      
      - name: Verify APK
        run: |
          ls -la android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk || (echo "APK not found!" && exit 1)
      
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: WebToApp Build ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
